name: Demo voice sims

on:
  workflow_dispatch:
  schedule:
    # Mondays 14:00 UTC
    - cron: '0 14 * * 1'

permissions:
  contents: read

jobs:
  sims:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Sync and run Retell demo-voice pack
        env:
          RETELL_API_KEY: ${{ secrets.RETELL_API_KEY }}
        run: |
          if [ -z "$RETELL_API_KEY" ]; then
            echo "error: RETELL_API_KEY secret is not set (OwnerAI demo workspace key only)"
            exit 1
          fi
          node scripts/sync-demo-sims.mjs --run
