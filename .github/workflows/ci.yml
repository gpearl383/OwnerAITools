name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Demo sample-budget unit tests
        run: node scripts/test-demo-limits.mjs
      - name: Demo sim cases sanity
        run: node scripts/assert-demo-sim-cases.mjs
      - name: Demo alert disclosure / compose / normalize / parallel
        run: |
          node scripts/test-demo-alert-disclosure.mjs
          node scripts/test-demo-alert-compose-wait.mjs
          node scripts/test-demo-alert-normalize.mjs
          node scripts/test-demo-alert-parallel.mjs
      - name: Webhook consent gates + rescue signals
        run: node scripts/test-webhook-consent-gates.mjs
      - name: Call-quality metrics (Sep-10 fixture)
        run: node scripts/test-call-quality.mjs
      - name: Retell tool-base rewrite unit tests
        run: node scripts/test-retell-tool-base.mjs
      - name: Retell live-transfer destination unit tests
        run: node scripts/test-retell-transfer-phone.mjs
      - name: Security helper unit tests
        run: node scripts/test-security-helpers.mjs
