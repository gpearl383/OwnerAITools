<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>OwnerAI — Set password</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2314355e'/%3E%3Cpath d='M23.5 20.4v2.1a1.4 1.4 0 0 1-1.53 1.4 13.85 13.85 0 0 1-6.04-2.15 13.65 13.65 0 0 1-4.2-4.2A13.85 13.85 0 0 1 9.58 11.5 1.4 1.4 0 0 1 10.98 10h2.1a1.4 1.4 0 0 1 1.4 1.2c.09.67.25 1.33.49 1.97a1.4 1.4 0 0 1-.32 1.48l-.89.89a11.2 11.2 0 0 0 4.2 4.2l.89-.89a1.4 1.4 0 0 1 1.48-.31c.63.23 1.3.4 1.97.48a1.4 1.4 0 0 1 1.2 1.42z' fill='%23ff9046'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14355e; --navy-deep:#0d2748; --navy-soft:#1d4879; --primary:#2680cf; --primary-600:#1a66b0;
  --primary-50:#eef6fd; --accent:#f97125; --accent-600:#e25a12;
  --mist:#f2f7fc; --bg:#ffffff; --border:rgba(20,53,94,.10); --border-strong:rgba(20,53,94,.18);
  --text:#24384f; --muted:#5a6b81; --display:"Nunito",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif; --radius:18px;
  --shadow-card:0 16px 42px -22px rgba(20,53,94,.28); --ok:#1a8a4f; --bad:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--body);background:linear-gradient(135deg,#eef6fd 0%,var(--mist) 48%,#f8fbfe 100%);color:var(--text);min-height:100vh}
h1{font-family:var(--display);color:var(--navy)}
.topbar{background:linear-gradient(110deg,var(--navy-deep),var(--navy) 62%,var(--navy-soft));color:#fff;padding:15px 24px}
.topbar .brand{font-family:var(--display);font-weight:800;font-size:18px;color:#fff;text-decoration:none}
.topbar .brand span{color:var(--accent)}
.login-card{max-width:400px;margin:10vh auto 0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:36px 32px;text-align:center}
.login-card h1{font-size:24px;margin-bottom:6px}
.login-card p{color:var(--muted);font-size:15px;margin-bottom:22px}
.login-card .email{font-family:var(--display);font-weight:800;color:var(--navy);margin-bottom:18px;font-size:15px}
.login-card input{width:100%;padding:13px 16px;font-size:16px;font-family:var(--body);border:1px solid var(--border-strong);border-radius:10px;margin-bottom:14px}
.login-card input:focus{outline:2px solid var(--primary);border-color:var(--primary)}
.btn{font-family:var(--display);font-weight:700;border:none;border-radius:999px;cursor:pointer;padding:13px 20px;font-size:14px;width:100%}
.btn-orange{background:var(--accent);color:#fff}
.btn-orange:hover{background:var(--accent-600)}
.btn-orange:disabled{opacity:.55;cursor:not-allowed}
.login-err{color:var(--bad);font-size:14px;margin-top:12px;min-height:18px}
.login-ok{color:var(--ok);font-size:15px;margin-top:8px;line-height:1.45}
.login-ok a{color:var(--primary);font-weight:700}
.hint{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/sales">Owner<span>AI</span> Demo</a>
</header>

<div class="login-card">
  <h1>Set your password</h1>
  <p id="intro">Choose a password for the OwnerAI demo console.</p>
  <div class="email" id="email-line" hidden></div>
  <form id="pw-form" hidden>
    <input type="password" id="pw" placeholder="New password (min 10 characters)" autocomplete="new-password" required minlength="10">
    <input type="password" id="pw2" placeholder="Confirm password" autocomplete="new-password" required minlength="10">
    <button class="btn btn-orange" type="submit" id="submit-btn">Save password</button>
  </form>
  <div class="login-err" id="err"></div>
  <div class="login-ok" id="ok" hidden></div>
  <p class="hint" id="hint">Link expires in 7 days and can only be used once.</p>
</div>

<script>
(function () {
  'use strict';
  var API = '/api/sales';
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var $ = function (id) { return document.getElementById(id); };

  function showErr(msg) {
    $('err').textContent = msg || '';
    $('ok').hidden = true;
  }

  if (!token) {
    $('intro').textContent = 'This link is missing a token.';
    showErr('Open the link from your invite email.');
    $('hint').hidden = true;
    return;
  }

  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ inviteLookup: true, token: token }),
  }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (!res.ok) {
        $('intro').textContent = 'This invite link is not valid.';
        showErr(res.d.error || 'Invalid or expired invite link');
        $('hint').hidden = true;
        return;
      }
      $('email-line').hidden = false;
      $('email-line').textContent = res.d.email;
      $('pw-form').hidden = false;
    })
    .catch(function () {
      showErr('Network error — try again.');
    });

  $('pw-form').addEventListener('submit', function (e) {
    e.preventDefault();
    showErr('');
    var a = $('pw').value;
    var b = $('pw2').value;
    if (a.length < 10) {
      showErr('Password must be at least 10 characters.');
      return;
    }
    if (a !== b) {
      showErr('Passwords do not match.');
      return;
    }
    $('submit-btn').disabled = true;
    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ setPassword: true, token: token, password: a }),
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        $('submit-btn').disabled = false;
        if (!res.ok) {
          showErr(res.d.error || 'Could not save password');
          return;
        }
        $('pw-form').hidden = true;
        $('hint').hidden = true;
        $('intro').textContent = 'Password saved.';
        $('ok').hidden = false;
        $('ok').innerHTML = 'You can now <a href="/sales">sign in to the demo console</a>.';
        showErr('');
      })
      .catch(function () {
        $('submit-btn').disabled = false;
        showErr('Network error — try again.');
      });
  });
})();
</script>
</body>
</html>
